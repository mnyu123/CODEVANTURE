[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24.15.0"
  NPM_VERSION = "11.13.0"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 15173
  port = 18888
  framework = "#custom"
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
